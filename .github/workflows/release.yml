name: Release

# A version tag (v0.1.0) builds the installers for Windows, macOS and Linux,
# the Flatpak and the command-line tool, and drafts a GitHub release with
# them. Run it by hand (Actions > Release > Run workflow) to build
# everything as workflow artifacts without a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: dmg
          - name: Windows
            os: windows-latest
            target: ''
            bundles: nsis,msi
          - name: Linux
            # The oldest supported runner, so the AppImage runs on older distributions.
            os: ubuntu-22.04
            target: ''
            bundles: appimage
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Linux libraries for Tauri, serial ports and AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config libfuse2 patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the installers
        shell: bash
        working-directory: crates/app
        run: |
          args="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then args="$args --target ${{ matrix.target }}"; fi
          npx --yes @tauri-apps/cli@2 build $args

      - name: Build the command-line tool
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release --locked -p ardutune-cli --target aarch64-apple-darwin
            cargo build --release --locked -p ardutune-cli --target x86_64-apple-darwin
            lipo -create -output dist/ardutune target/aarch64-apple-darwin/release/ardutune target/x86_64-apple-darwin/release/ardutune
            tar -C dist -czf dist/ardutune-cli-macos-universal.tar.gz ardutune
            rm dist/ardutune
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release --locked -p ardutune-cli
            7z a dist/ardutune-cli-windows-x64.zip ./target/release/ardutune.exe
          else
            cargo build --release --locked -p ardutune-cli
            tar -C target/release -czf dist/ardutune-cli-linux-x64.tar.gz ardutune
          fi

      - name: Collect the files
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release/bundle
          [ -d "$dir" ] || dir=target/release/bundle
          find "$dir" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ArduTune-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ArduTune.flatpak
          manifest-path: packaging/flatpak/io.github.evidolob.ArduTune.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: ArduTune-Flatpak
          path: ArduTune.flatpak
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ArduTune ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
