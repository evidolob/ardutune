[package]
name = "ardutune-cli"
description = "Command-line front end for ArduTune"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ardutune"
path = "src/main.rs"

[dependencies]
ardutune-core.workspace = true
ardutune-link = { workspace = true, features = ["native"] }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
dirs = "7"
serde_json.workspace = true
