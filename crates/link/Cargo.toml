[package]
name = "ardutune-link"
description = "MAVLink connection to ArduPilot vehicles: parameters and log download"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mavlink = { version = "0.21", default-features = false, features = ["std", "transport-tcp", "transport-udp", "transport-direct-serial", "dialect-ardupilotmega", "format-generated-code"] }
serialport = "4"
ardutune-core.workspace = true
base64 = "0.22"
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
ureq = "2"
