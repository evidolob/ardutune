[workspace]
resolver = "2"
members = ["crates/core", "crates/link", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ardutune-core = { path = "crates/core" }
ardutune-link = { path = "crates/link" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Analysis of a 90 MB log is too slow unoptimised; keep debug builds usable.
[profile.dev.package.ardutune-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
