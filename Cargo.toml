[workspace]
resolver = "2"
members = ["crates/core", "crates/link", "crates/cli", "crates/app", "crates/web"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ardutune-core = { path = "crates/core" }
ardutune-link = { path = "crates/link", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Analysis of a 90 MB log is too slow unoptimised; keep debug builds usable.
[profile.dev.package.ardutune-core]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
